# OpenClaw 调度任务定义（Roadmap V2 §3.1 / §11 / §17.1）
#
# 三个任务语义必须保留；具体 command 由部署方按实际 OpenClaw 环境调整。
# 所有任务默认 --send-mail 关闭，需显式开启才会投递邮件。

version: 1
tasks:
  - name: s4_r9_signal_check
    description: 每日信号检查：计算 S4 分档、目标权重与纸面调仓建议，并模拟成交
    schedule:
      cron: "10 0 * * *"
      timezone: "UTC"
    command: >-
      python -m openclaw_s4_paper.cli signal
      --strategy-config config/strategy.json
      --notification-config config/notification.json
      --account-config config/paper_account.json
      --state-dir state
      --market-dir data/paper_trading/market
      --send-mail
    working_directory: openclaw_s4_paper
    timeout_seconds: 900
    retry:
      max_attempts: 2
      backoff_seconds: 120
    on_failure: send_alert_email

  - name: s4_r9_paper_settlement
    description: 纸面收盘结算：按收盘价更新未实现盈亏、净值与回撤
    schedule:
      cron: "20 0 * * *"
      timezone: "UTC"
    command: >-
      python -m openclaw_s4_paper.cli settle
      --strategy-config config/strategy.json
      --account-config config/paper_account.json
      --state-dir state
      --market-dir data/paper_trading/market
    working_directory: openclaw_s4_paper
    timeout_seconds: 600
    retry:
      max_attempts: 2
      backoff_seconds: 120

  - name: s4_r9_health_check
    description: 健康检查：数据新鲜度、账本完整性、邮件状态、策略版本
    schedule:
      cron: "0 1 * * *"
      timezone: "UTC"
    command: >-
      python -m openclaw_s4_paper.cli health
      --strategy-config config/strategy.json
      --state-dir state
      --market-dir data/paper_trading/market
    working_directory: openclaw_s4_paper
    timeout_seconds: 300
    on_failure: send_alert_email

  # 市场数据更新（可选，独立于信号任务）。直连不可达时经 PAPER_PROXY 走代理。
  - name: s4_r9_market_data_refresh
    description: 下载 4H/1D/现金利率市场数据（直连可达则不用代理）
    schedule:
      cron: "0 0 * * *"
      timezone: "UTC"
    command: >-
      python -m openclaw_s4_paper.cli download
      --out-dir data/paper_trading/market
    working_directory: openclaw_s4_paper
    environment:
      PAPER_PROXY: "http://127.0.0.1:7897"
    timeout_seconds: 1800
    retry:
      max_attempts: 3
      backoff_seconds: 300